<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Интерактивные субтитры</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  #player-wrap {
    position: relative;
    width: 100%;
    max-height: 45vh;
    background: #000;
    flex-shrink: 0;
    transition: max-height 0.3s;
  }
  #ytplayer {
    width: 100%;
    height: 45vh;
    display: block;
    transition: height 0.3s;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  #toggleVideoBtn {
    cursor: pointer;
    padding: 6px 12px;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 14px;
    outline: none;
  }
  #toggleVideoBtn:hover {
    background: #444;
  }
  #toggleVideoBtn:focus {
    border-color: #4caf50;
  }
  .hint {
    color: #666;
    font-size: 12px;
  }
  #subtitles {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 80px;
    line-height: 1.4;
  }
  .cue {
    padding: 6px 10px;
    margin-bottom: 2px;
    border-radius: 4px;
    transition: background 0.2s;
    font-size: 15px;
    border-left: 3px solid transparent;
    cursor: pointer; /* Курсор-указатель, чтобы было понятно, что можно кликать */
  }
  .cue:hover {
    background: #222;
  }
  .cue.active {
    background: #2a2a2a;
    border-left-color: #4caf50;
  }
  .cue .en {
    color: #ddd;
    margin-bottom: 2px;
  }
  .cue .ru {
    color: #888;
    font-size: 14px;
  }
  #loading {
    padding: 20px;
    color: #888;
  }
</style>
</head>
<body>

<div id="player-wrap">
  <div id="ytplayer"></div>
</div>

<div id="controls">
  <button id="toggleVideoBtn">Скрыть видео (Enter)</button>
  <span class="hint">Пробел — пауза, ←/→ — ±5 сек, клик по субтитру — перемотка</span>
</div>

<div id="subtitles">
  <div id="loading">Загрузка субтитров…</div>
</div>

<script>
  // ===== 1. Загрузка субтитров =====
  let cues = [];
  let activeIndex = -1;
  let player = null;
  let playerReady = false;

  function timeToSeconds(t) {
    const parts = t.split(':').map(Number);
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return 0;
  }

  fetch('deepseek.json')
    .then(r => {
      if (!r.ok) throw new Error('Не удалось загрузить deepseek.json');
      return r.json();
    })
    .then(data => {
      cues = data.map(c => ({
        ...c,
        seconds: timeToSeconds(c.time)
      }));
      renderCues();
      
      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.remove();
    })
    .catch(err => {
      const subDiv = document.getElementById('subtitles');
      if (subDiv) {
        subDiv.innerHTML =
          '<div id="loading">Ошибка загрузки: ' + err.message + '<br>Убедитесь, что deepseek.json лежит рядом и запущен сервер.</div>';
      }
    });

  function renderCues() {
    const container = document.getElementById('subtitles');
    container.innerHTML = '';
    cues.forEach((cue, i) => {
      const div = document.createElement('div');
      div.className = 'cue';
      div.dataset.index = i;
      div.dataset.time = cue.seconds; // Сохраняем время начала для перемотки

      const en = document.createElement('div');
      en.className = 'en';
      en.textContent = cue.text;

      const ru = document.createElement('div');
      ru.className = 'ru';
      ru.textContent = cue.translation;

      div.appendChild(en);
      div.appendChild(ru);
      container.appendChild(div);
    });

    // Клик по блоку субтитров — перемотка
    container.addEventListener('click', e => {
      const cueEl = e.target.closest('.cue');
      if (!cueEl) return;
      
      const timeToSeek = parseFloat(cueEl.dataset.time);
      if (playerReady && player && typeof player.seekTo === 'function') {
        player.seekTo(timeToSeek, true);
        // Включаем воспроизведение, если на паузе
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
          player.playVideo();
        }
      }
    });
  }

  // ===== 2. YouTube IFrame API =====
  const VIDEO_ID = 'rk2dsMOoe8U';

  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('ytplayer', {
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 0,
        controls: 1,
        rel: 0,
        modestbranding: 1
      },
      events: {
        onReady: () => { playerReady = true; },
        onStateChange: () => {}
      }
    });
  };

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  // ===== 3. Синхронизация субтитров =====
  setInterval(() => {
    if (!playerReady || !player || typeof player.getCurrentTime !== 'function') return;
    const t = player.getCurrentTime();

    let idx = -1;
    for (let i = 0; i < cues.length; i++) {
      if (t >= cues[i].seconds) idx = i;
      else break;
    }

    if (idx !== activeIndex) {
      activeIndex = idx;
      const container = document.getElementById('subtitles');
      const els = container.querySelectorAll('.cue');
      els.forEach((el, i) => el.classList.toggle('active', i === idx));
      if (idx >= 0 && els[idx]) {
        els[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
  }, 250);

  // ===== 4. Управление видео (скрыть/показать) =====
  let isVideoHidden = false;
  const videoBtn = document.getElementById('toggleVideoBtn');
  const playerWrap = document.getElementById('player-wrap');
  const ytPlayerDiv = document.getElementById('ytplayer');

  function toggleVideoVisibility() {
    isVideoHidden = !isVideoHidden;
    if (isVideoHidden) {
      playerWrap.style.maxHeight = '0';
      playerWrap.style.overflow = 'hidden';
      ytPlayerDiv.style.height = '0';
      videoBtn.textContent = 'Показать видео (Enter)';
    } else {
      playerWrap.style.maxHeight = '45vh';
      playerWrap.style.overflow = 'visible';
      ytPlayerDiv.style.height = '45vh';
      videoBtn.textContent = 'Скрыть видео (Enter)';
    }
    videoBtn.blur();
  }

  videoBtn.addEventListener('click', toggleVideoVisibility);

  // ===== 5. Горячие клавиши =====
  document.addEventListener('keydown', e => {
    if (!playerReady || !player) return;
    
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.code === 'Space') {
      e.preventDefault();
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) player.pauseVideo();
      else player.playVideo();
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      player.seekTo(Math.min(player.getCurrentTime() + 5, player.getDuration()), true);
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      player.seekTo(Math.max(player.getCurrentTime() - 5, 0), true);
    } else if (e.code === 'Enter') {
      e.preventDefault();
      toggleVideoVisibility();
    }
  });
</script>

</body>
</html>
