<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Субтитры</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  /* Плеер полностью скрыт */
  #player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* Контейнер текста */
  #subtitles-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow-y: hidden; /* Программная прокрутка */
    padding: 50vh 10vw; /* Отступы, чтобы первый и последний блоки могли центрироваться */
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Блок текста. Никаких выделений, прозрачностей и масштабов */
  .cue {
    text-align: center;
    margin-bottom: 40px;
    pointer-events: none;
  }

  .cue .en {
    font-size: 2rem;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 0.5rem;
    color: #fff;
  }

  .cue .ru {
    font-size: 1.5rem;
    color: #aaa;
    line-height: 1.3;
    font-weight: 400;
  }

  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #666;
    font-size: 1.2rem;
  }
</style>
</head>
<body>

<div id="player-container">
  <div id="ytplayer"></div>
</div>

<div id="subtitles-container">
  <div id="loading">Загрузка…</div>
</div>

<script>
  let cues = [];
  let activeIndex = -1;
  let player = null;
  let playerReady = false;

  // Перевод времени в секунды
  function timeToSeconds(t) {
    const parts = t.split(':').map(Number);
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return 0;
  }

  // 1. Загрузка данных
  fetch('deepseek.json')
    .then(r => {
      if (!r.ok) throw new Error('Файл не найден');
      return r.json();
    })
    .then(data => {
      cues = data.map(c => ({
        ...c,
        seconds: timeToSeconds(c.time)
      }));
      renderCues();
      const l = document.getElementById('loading');
      if (l) l.remove();
    })
    .catch(err => {
      document.getElementById('subtitles-container').innerHTML = 
        `<div id="loading" style="color:red">Ошибка: ${err.message}</div>`;
    });

  // 2. Отрисовка
  function renderCues() {
    const container = document.getElementById('subtitles-container');
    container.innerHTML = '';
    
    cues.forEach((cue, i) => {
      const div = document.createElement('div');
      div.className = 'cue';
      div.dataset.index = i;

      const en = document.createElement('div');
      en.className = 'en';
      en.textContent = cue.text;

      const ru = document.createElement('div');
      ru.className = 'ru';
      ru.textContent = cue.translation;

      div.appendChild(en);
      div.appendChild(ru);
      container.appendChild(div);
    });
  }

  // 3. YouTube API (скрытый)
  const VIDEO_ID = 'rk2dsMOoe8U';
  
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('ytplayer', {
      videoId: VIDEO_ID,
      playerVars: { 
        autoplay: 0, 
        controls: 0, 
        rel: 0, 
        disablekb: 1 
      },
      events: { 
        onReady: () => { playerReady = true; } 
      }
    });
  };

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  // ==========================================
  // 4. ПЛАВНОЕ ЦЕНТРИРОВАНИЕ (БЕЗ ВЫДЕЛЕНИЙ)
  // ==========================================
  
  let targetScrollTop = 0;

  function syncLoop() {
    if (!playerReady || !player || typeof player.getCurrentTime !== 'function') {
      requestAnimationFrame(syncLoop);
      return;
    }

    const currentTime = player.getCurrentTime();
    const container = document.getElementById('subtitles-container');

    // Находим индекс текущего блока по времени
    let idx = -1;
    for (let i = 0; i < cues.length; i++) {
      if (currentTime >= cues[i].seconds) idx = i;
      else break;
    }

    // Если индекс изменился, обновляем целевую позицию
    if (idx !== activeIndex) {
      activeIndex = idx;
      
      if (idx !== -1) {
        const currentEl = container.querySelector(`.cue[data-index="${idx}"]`);
        if (currentEl) {
          const elCenter = currentEl.offsetTop + currentEl.offsetHeight / 2;
          targetScrollTop = elCenter - (window.innerHeight / 2);
        }
      }
    }

    // Плавная прокрутка к целевой позиции (интерполяция)
    const diff = targetScrollTop - container.scrollTop;
    
    if (Math.abs(diff) < 0.5) {
      container.scrollTop = targetScrollTop;
    } else {
      container.scrollTop += diff * 0.08;
    }

    requestAnimationFrame(syncLoop);
  }

  setTimeout(() => {
    requestAnimationFrame(syncLoop);
  }, 1000);

  // ==========================================
  // 5. КЛАВИШИ
  // ==========================================
  
  document.addEventListener('keydown', e => {
    if (!playerReady || !player) return;

    if (e.code === 'Space') {
      e.preventDefault();
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) player.pauseVideo();
      else player.playVideo();
    }
    
    if (e.code === 'ArrowRight') {
      e.preventDefault();
      player.seekTo(Math.min(player.getCurrentTime() + 5, player.getDuration()), true);
    }
    
    if (e.code === 'ArrowLeft') {
      e.preventDefault();
      player.seekTo(Math.max(player.getCurrentTime() - 5, 0), true);
    }
  });
</script>

</body>
</html>
