<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Плавные субтитры</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  #player-wrap {
    position: relative;
    width: 100%;
    max-height: 40vh;
    background: #000;
    flex-shrink: 0;
    transition: max-height 0.3s;
  }
  #ytplayer {
    width: 100%;
    height: 40vh;
    display: block;
    transition: height 0.3s;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #toggleVideoBtn {
    cursor: pointer;
    padding: 6px 12px;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 14px;
    outline: none;
  }
  #toggleVideoBtn:hover { background: #444; }
  #toggleVideoBtn:focus { border-color: #4caf50; }
  
  .hint { color: #666; font-size: 12px; }

  /* Контейнер субтитров */
  #subtitles {
    flex: 1;
    overflow-y: auto;
    /* Огромные отступы, чтобы любой блок мог оказаться в центре */
    padding: 30vh 16px 50vh; 
    line-height: 1.5;
    /* Отключаем стандартную плавность, будем управлять скроллом вручную */
    scroll-behavior: auto; 
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
  }

  .cue {
    padding: 12px 20px;
    margin-bottom: 8px;
    border-radius: 8px;
    transition: opacity 0.4s, background 0.4s;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.2; /* Неактивные блоки сильно тусклые */
    text-align: center;
    transform: scale(0.95); /* Неактивные чуть меньше */
    transition: all 0.4s ease-out;
  }

  .cue:hover {
    opacity: 0.6;
    background: #1a1a1a;
  }

  .cue.active {
    opacity: 1;
    transform: scale(1); /* Активный блок увеличивается */
    background: transparent; /* Убрали фон, чтобы не было прямоугольников */
  }

  .cue .en {
    color: #fff;
    margin-bottom: 6px;
    font-weight: 600;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .cue .ru {
    color: #bbb;
    font-size: 16px;
    font-weight: 400;
  }
  
  #loading {
    padding: 20px;
    color: #888;
    text-align: center;
  }
</style>
</head>
<body>

<div id="player-wrap">
  <div id="ytplayer"></div>
</div>

<div id="controls">
  <button id="toggleVideoBtn">Скрыть видео (Enter)</button>
  <span class="hint">Пробел — пауза, ←/→ — ±5 сек, клик по тексту — перемотка</span>
</div>

<div id="subtitles">
  <div id="loading">Загрузка субтитров…</div>
</div>

<script>
  let cues = [];
  let activeIndex = -1;
  let player = null;
  let playerReady = false;

  function timeToSeconds(t) {
    const parts = t.split(':').map(Number);
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return 0;
  }

  fetch('deepseek.json')
    .then(r => {
      if (!r.ok) throw new Error('Не удалось загрузить deepseek.json');
      return r.json();
    })
    .then(data => {
      cues = data.map(c => ({
        ...c,
        seconds: timeToSeconds(c.time)
      }));
      renderCues();
      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.remove();
    })
    .catch(err => {
      const subDiv = document.getElementById('subtitles');
      if (subDiv) {
        subDiv.innerHTML =
          '<div id="loading">Ошибка загрузки: ' + err.message + '<br>Убедитесь, что deepseek.json лежит рядом.</div>';
      }
    });

  function renderCues() {
    const container = document.getElementById('subtitles');
    container.innerHTML = '';
    cues.forEach((cue, i) => {
      const div = document.createElement('div');
      div.className = 'cue';
      div.dataset.index = i;
      div.dataset.time = cue.seconds;

      const en = document.createElement('div');
      en.className = 'en';
      en.textContent = cue.text;

      const ru = document.createElement('div');
      ru.className = 'ru';
      ru.textContent = cue.translation;

      div.appendChild(en);
      div.appendChild(ru);
      container.appendChild(div);
    });

    // Клик — перемотка на начало блока
    container.addEventListener('click', e => {
      const cueEl = e.target.closest('.cue');
      if (!cueEl) return;
      
      const timeToSeek = parseFloat(cueEl.dataset.time);
      if (playerReady && player && typeof player.seekTo === 'function') {
        player.seekTo(timeToSeek, true);
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
          player.playVideo();
        }
      }
    });
  }

  // YouTube API
  const VIDEO_ID = 'rk2dsMOoe8U';
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('ytplayer', {
      videoId: VIDEO_ID,
      playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
      events: { onReady: () => { playerReady = true; } }
    });
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  // ==========================================
  // НОВАЯ ЛОГИКА ПЛАВНОЙ СИНХРОНИЗАЦИИ
  // ==========================================
  
  let currentScrollTop = 0; // Текущее положение скролла
  let targetScrollTop = 0;  // Целевое положение скролла

  function updateSubtitlePosition() {
    if (!playerReady || !player || typeof player.getCurrentTime !== 'function') {
      requestAnimationFrame(updateSubtitlePosition);
      return;
    }

    const currentTime = player.getCurrentTime();

    // 1. Находим активный блок
    let idx = -1;
    for (let i = 0; i < cues.length; i++) {
      if (currentTime >= cues[i].seconds) idx = i;
      else break;
    }

    // 2. Обновляем классы (если индекс изменился)
    if (idx !== activeIndex) {
      activeIndex = idx;
      const els = document.querySelectorAll('.cue');
      els.forEach((el, i) => el.classList.toggle('active', i === idx));
    }

    // 3. Вычисляем целевой скролл для ЦЕНТРИРОВАНИЯ
    const container = document.getElementById('subtitles');
    if (container && idx !== -1) {
      const currentEl = container.querySelector(`.cue[data-index="${idx}"]`);
      
      if (currentEl) {
        // Получаем координаты центра блока относительно контейнера
        const elCenter = currentEl.offsetTop + currentEl.offsetHeight / 2;
        
        // Целевая позиция скролла: центрируем блок
        targetScrollTop = elCenter - (container.clientHeight / 2);
      }
    }

    // 4. ПЛАВНАЯ ПРОКРУТКА (интерполяция)
    // Вместо мгновенного прыжка, мы каждый кадр сдвигаем скролл на 10% от разницы
    // Это создает идеально плавное "догоняние" без рывков
    const diff = targetScrollTop - container.scrollTop;
    
    // Если разница очень маленькая, просто приравниваем (чтобы не было микро-дрожания)
    if (Math.abs(diff) < 0.5) {
      container.scrollTop = targetScrollTop;
    } else {
      container.scrollTop += diff * 0.1; // Коэффициент плавности (0.1 = 10% за кадр)
    }

    requestAnimationFrame(updateSubtitlePosition);
  }

  // Запуск цикла синхронизации
  setTimeout(() => {
    requestAnimationFrame(updateSubtitlePosition);
  }, 1000);


  // ===== Управление видео =====
  let isVideoHidden = false;
  const videoBtn = document.getElementById('toggleVideoBtn');
  const playerWrap = document.getElementById('player-wrap');
  const ytPlayerDiv = document.getElementById('ytplayer');

  function toggleVideoVisibility() {
    isVideoHidden = !isVideoHidden;
    if (isVideoHidden) {
      playerWrap.style.maxHeight = '0';
      playerWrap.style.overflow = 'hidden';
      ytPlayerDiv.style.height = '0';
      videoBtn.textContent = 'Показать видео (Enter)';
    } else {
      playerWrap.style.maxHeight = '40vh';
      playerWrap.style.overflow = 'visible';
      ytPlayerDiv.style.height = '40vh';
      videoBtn.textContent = 'Скрыть видео (Enter)';
    }
    videoBtn.blur();
  }

  videoBtn.addEventListener('click', toggleVideoVisibility);

  // ===== Горячие клавиши =====
  document.addEventListener('keydown', e => {
    if (!playerReady || !player) return;
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.code === 'Space') {
      e.preventDefault();
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) player.pauseVideo();
      else player.playVideo();
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      player.seekTo(Math.min(player.getCurrentTime() + 5, player.getDuration()), true);
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      player.seekTo(Math.max(player.getCurrentTime() - 5, 0), true);
    } else if (e.code === 'Enter') {
      e.preventDefault();
      toggleVideoVisibility();
    }
  });
</script>

</body>
</html>
