<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Плавные субтитры</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  
  #player-wrap {
    position: relative;
    width: 100%;
    max-height: 40vh;
    background: #000;
    flex-shrink: 0;
    transition: max-height 0.3s, opacity 0.3s;
    overflow: hidden;
  }
  #ytplayer {
    width: 100%;
    height: 40vh;
    display: block;
    transition: height 0.3s;
  }
  
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  
  #toggleVideoBtn {
    cursor: pointer;
    padding: 6px 12px;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 14px;
    outline: none;
  }
  #toggleVideoBtn:hover { background: #444; }
  #toggleVideoBtn:focus { border-color: #4caf50; }
  
  .hint { color: #666; font-size: 12px; }

  /* Контейнер субтитров */
  #subtitles {
    flex: 1;
    overflow-y: auto;
    /* Отступы для возможности центрирования первого и последнего блока */
    padding: 50vh 16px 50vh; 
    line-height: 1.5;
    /* Запрещаем выделение текста мышью */
    user-select: none;
    -webkit-user-select: none;
    /* Отключаем стандартную плавность, управляем вручную */
    scroll-behavior: auto; 
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
  }

  .cue {
    padding: 12px 20px;
    margin-bottom: 8px;
    border-radius: 8px;
    font-size: 18px;
    text-align: center;
    /* Отключаем любые переходы и ховеры */
    transition: none; 
    cursor: default;
    opacity: 0.2; 
  }

  /* Убираем любые эффекты при наведении и нажатии */
  .cue:hover, .cue:active {
    background: transparent;
    opacity: 0.2;
    transform: none;
  }

  /* Активный блок */
  .cue.active {
    opacity: 1;
    transform: scale(1.05); /* Легкое увеличение активного блока */
    transition: opacity 0.3s, transform 0.3s; /* Оставляем плавность только для смены блока */
  }

  .cue .en {
    color: #fff;
    margin-bottom: 6px;
    font-weight: 600;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .cue .ru {
    color: #bbb;
    font-size: 16px;
    font-weight: 400;
  }
  
  #loading {
    padding: 20px;
    color: #888;
    text-align: center;
  }
</style>
</head>
<body>

<div id="player-wrap">
  <div id="ytplayer"></div>
</div>

<div id="controls">
  <button id="toggleVideoBtn">Скрыть видео (Enter)</button>
  <span class="hint">Пробел — пауза, ←/→ — ±5 сек</span>
</div>

<div id="subtitles">
  <div id="loading">Загрузка субтитров…</div>
</div>

<script>
  let cues = [];
  let activeIndex = -1;
  let player = null;
  let playerReady = false;
  let isVideoHidden = false; // Флаг для расчета центрирования

  function timeToSeconds(t) {
    const parts = t.split(':').map(Number);
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return 0;
  }

  fetch('deepseek.json')
    .then(r => {
      if (!r.ok) throw new Error('Не удалось загрузить deepseek.json');
      return r.json();
    })
    .then(data => {
      cues = data.map(c => ({
        ...c,
        seconds: timeToSeconds(c.time)
      }));
      renderCues();
      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.remove();
    })
    .catch(err => {
      const subDiv = document.getElementById('subtitles');
      if (subDiv) {
        subDiv.innerHTML =
          '<div id="loading">Ошибка загрузки: ' + err.message + '<br>Убедитесь, что deepseek.json лежит рядом.</div>';
      }
    });

  function renderCues() {
    const container = document.getElementById('subtitles');
    container.innerHTML = '';
    cues.forEach((cue, i) => {
      const div = document.createElement('div');
      div.className = 'cue';
      div.dataset.index = i;

      const en = document.createElement('div');
      en.className = 'en';
      en.textContent = cue.text;

      const ru = document.createElement('div');
      ru.className = 'ru';
      ru.textContent = cue.translation;

      div.appendChild(en);
      div.appendChild(ru);
      container.appendChild(div);
    });
    // Обработчик клика полностью удален
  }

  // YouTube API
  const VIDEO_ID = 'rk2dsMOoe8U';
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('ytplayer', {
      videoId: VIDEO_ID,
      playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
      events: { onReady: () => { playerReady = true; } }
    });
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  // ==========================================
  // ЛОГИКА ПЛАВНОЙ СИНХРОНИЗАЦИИ И ЦЕНТРИРОВАНИЯ
  // ==========================================
  
  let targetScrollTop = 0;

  function updateSubtitlePosition() {
    if (!playerReady || !player || typeof player.getCurrentTime !== 'function') {
      requestAnimationFrame(updateSubtitlePosition);
      return;
    }

    const currentTime = player.getCurrentTime();

    // 1. Находим активный блок
    let idx = -1;
    for (let i = 0; i < cues.length; i++) {
      if (currentTime >= cues[i].seconds) idx = i;
      else break;
    }

    // 2. Обновляем классы
    if (idx !== activeIndex) {
      activeIndex = idx;
      const els = document.querySelectorAll('.cue');
      els.forEach((el, i) => el.classList.toggle('active', i === idx));
    }

    // 3. Вычисляем целевой скролл для ЦЕНТРИРОВАНИЯ
    const container = document.getElementById('subtitles');
    if (container && idx !== -1) {
      const currentEl = container.querySelector(`.cue[data-index="${idx}"]`);
      
      if (currentEl) {
        // Получаем координаты центра блока относительно контейнера
        const elCenter = currentEl.offsetTop + currentEl.offsetHeight / 2;
        
        // Вычисляем, сколько места занимает плеер и панель управления СВЕРХУ
        const playerWrap = document.getElementById('player-wrap');
        const controls = document.getElementById('controls');
        const topOffset = playerWrap.offsetHeight + controls.offsetHeight;
        
        // Высота видимой области для субтитров = общая высота минус плеер и панель
        const visibleHeight = window.innerHeight - topOffset;
        
        // Центрируем блок относительно этой видимой области
        // container.getBoundingClientRect().top - это координата начала контейнера субтитров на экране
        targetScrollTop = elCenter - (visibleHeight / 2);
        
        // Плавная прокрутка
        const diff = targetScrollTop - container.scrollTop;
        if (Math.abs(diff) < 1) {
          container.scrollTop = targetScrollTop;
        } else {
          container.scrollTop += diff * 0.1;
        }
      }
    }

    requestAnimationFrame(updateSubtitlePosition);
  }

  // Запуск цикла
  setTimeout(() => {
    requestAnimationFrame(updateSubtitlePosition);
  }, 1000);

  // ===== Управление видео =====
  const videoBtn = document.getElementById('toggleVideoBtn');
  const playerWrap = document.getElementById('player-wrap');
  const ytPlayerDiv = document.getElementById('ytplayer');

  function toggleVideoVisibility() {
    isVideoHidden = !isVideoHidden;
    if (isVideoHidden) {
      playerWrap.style.maxHeight = '0';
      playerWrap.style.opacity = '0';
      ytPlayerDiv.style.height = '0';
      videoBtn.textContent = 'Показать видео (Enter)';
    } else {
      playerWrap.style.maxHeight = '40vh';
      playerWrap.style.opacity = '1';
      ytPlayerDiv.style.height = '40vh';
      videoBtn.textContent = 'Скрыть видео (Enter)';
    }
    videoBtn.blur();
    // Даем время на анимацию скрытия плеера, затем принудительно пересчитываем позицию
    setTimeout(() => {
      targetScrollTop = -9999; // Форсируем пересчет
    }, 350);
  }

  videoBtn.addEventListener('click', toggleVideoVisibility);

  // ===== Горячие клавиши =====
  document.addEventListener('keydown', e => {
    if (!playerReady || !player) return;
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.code === 'Space') {
      e.preventDefault();
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) player.pauseVideo();
      else player.playVideo();
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      player.seekTo(Math.min(player.getCurrentTime() + 5, player.getDuration()), true);
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      player.seekTo(Math.max(player.getCurrentTime() - 5, 0), true);
    } else if (e.code === 'Enter') {
      e.preventDefault();
      toggleVideoVisibility();
    }
  });
</script>

</body>
</html>
