<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Субтитры</title>
<style>
  /* Сбрасываем все отступы и запрещаем выделение */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  /* Скрытый контейнер для плеера (он есть, но его не видно) */
  #player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* Контейнер субтитров на весь экран */
  #subtitles-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow-y: hidden; /* Прокрутку делаем программно */
    padding: 50vh 10vw; /* Отступы, чтобы текст всегда мог быть в центре */
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Блок субтитра */
  .cue {
    text-align: center;
    margin-bottom: 40px; /* Расстояние между блоками */
    opacity: 0.15; /* Неактивные блоки тусклые */
    transition: opacity 0.4s ease, transform 0.4s ease;
    transform: scale(0.9);
    pointer-events: none; /* Отключаем любые клики по блокам */
  }

  /* Активный блок */
  .cue.active {
    opacity: 1;
    transform: scale(1);
  }

  .cue .en {
    font-size: 2rem;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .cue .ru {
    font-size: 1.5rem;
    color: #aaa;
    line-height: 1.3;
    font-weight: 400;
  }

  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #666;
    font-size: 1.2rem;
  }
</style>
</head>
<body>

<!-- Плеер физически есть, но скрыт и невидим -->
<div id="player-container">
  <div id="ytplayer"></div>
</div>

<!-- Текст на весь экран -->
<div id="subtitles-container">
  <div id="loading">Загрузка…</div>
</div>

<script>
  let cues = [];
  let activeIndex = -1;
  let player = null;
  let playerReady = false;
  let targetScrollTop = 0;

  // Функция перевода времени в секунды
  function timeToSeconds(t) {
    const parts = t.split(':').map(Number);
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return 0;
  }

  // 1. Загрузка JSON
  fetch('deepseek.json')
    .then(r => {
      if (!r.ok) throw new Error('Файл не найден');
      return r.json();
    })
    .then(data => {
      cues = data.map(c => ({
        ...c,
        seconds: timeToSeconds(c.time)
      }));
      renderCues();
      const l = document.getElementById('loading');
      if (l) l.remove();
    })
    .catch(err => {
      document.getElementById('subtitles-container').innerHTML = 
        `<div id="loading" style="color:red">Ошибка: ${err.message}</div>`;
    });

  // 2. Отрисовка блоков
  function renderCues() {
    const container = document.getElementById('subtitles-container');
    container.innerHTML = '';
    
    cues.forEach((cue, i) => {
      const div = document.createElement('div');
      div.className = 'cue';
      div.dataset.index = i;

      const en = document.createElement('div');
      en.className = 'en';
      en.textContent = cue.text;

      const ru = document.createElement('div');
      ru.className = 'ru';
      ru.textContent = cue.translation;

      div.appendChild(en);
      div.appendChild(ru);
      container.appendChild(div);
    });
  }

  // 3. Подключение YouTube API (невидимое)
  const VIDEO_ID = 'rk2dsMOoe8U';
  
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('ytplayer', {
      videoId: VIDEO_ID,
      playerVars: { 
        autoplay: 0, 
        controls: 0, 
        rel: 0, 
        modestbranding: 1,
        disablekb: 1 // Отключаем родные горячие клавиши ютуба
      },
      events: { 
        onReady: () => { playerReady = true; } 
      }
    });
  };

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  // ==========================================
  // 4. ПЛАВНАЯ СИНХРОНИЗАЦИЯ И ЦЕНТРИРОВАНИЕ
  // ==========================================
  
  function syncLoop() {
    if (!playerReady || !player || typeof player.getCurrentTime !== 'function') {
      requestAnimationFrame(syncLoop);
      return;
    }

    const currentTime = player.getCurrentTime();
    const container = document.getElementById('subtitles-container');

    // Находим текущий блок
    let idx = -1;
    for (let i = 0; i < cues.length; i++) {
      if (currentTime >= cues[i].seconds) idx = i;
      else break;
    }

    // Меняем активный класс, если блок сменился
    if (idx !== activeIndex) {
      activeIndex = idx;
      const els = container.querySelectorAll('.cue');
      els.forEach((el, i) => el.classList.toggle('active', i === idx));
    }

    // Плавное центрирование
    if (idx !== -1) {
      const currentEl = container.querySelector(`.cue[data-index="${idx}"]`);
      
      if (currentEl) {
        // Вычисляем, где находится центр этого блока
        const elCenter = currentEl.offsetTop + currentEl.offsetHeight / 2;
        
        // Нам нужно, чтобы этот центр оказался ровно посередине экрана.
        // Высота экрана = window.innerHeight. Центр экрана = window.innerHeight / 2.
        // Позиция скролла = elCenter - (window.innerHeight / 2)
        targetScrollTop = elCenter - (window.innerHeight / 2);

        // Плавная интерполяция (чем меньше коэффициент, тем плавнее и медленнее)
        const diff = targetScrollTop - container.scrollTop;
        
        if (Math.abs(diff) < 0.5) {
          container.scrollTop = targetScrollTop;
        } else {
          container.scrollTop += diff * 0.08; // 0.08 = 8% пути за кадр
        }
      }
    }

    requestAnimationFrame(syncLoop);
  }

  // Запуск цикла после инициализации
  setTimeout(() => {
    requestAnimationFrame(syncLoop);
  }, 1000);

  // ==========================================
  // 5. УПРАВЛЕНИЕ С КЛАВИАТУРЫ
  // ==========================================
  
  document.addEventListener('keydown', e => {
    if (!playerReady || !player) return;

    // Пробел: Пауза / Воспроизведение
    if (e.code === 'Space') {
      e.preventDefault(); // Чтобы страница не скроллилась
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }
    
    // Стрелка вправо: +5 секунд
    if (e.code === 'ArrowRight') {
      e.preventDefault();
      player.seekTo(Math.min(player.getCurrentTime() + 5, player.getDuration()), true);
    }
    
    // Стрелка влево: -5 секунд
    if (e.code === 'ArrowLeft') {
      e.preventDefault();
      player.seekTo(Math.max(player.getCurrentTime() - 5, 0), true);
    }
  });
</script>

</body>
</html>
